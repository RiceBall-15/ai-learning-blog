<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 背景 - 现代渐变 -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 主体圆形 -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)"/>
  
  <!-- AI 符号 -->
  <path d="M10 20L16 12L22 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 中心点 -->
  <circle cx="16" cy="16" r="2" fill="white"/>
  
  <!-- 连接线 -->
  <line x1="16" y1="12" x2="16" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="16" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
